name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt httpx
      - run: python -m unittest discover -s tests -v
      - run: bash -n deploy/firewall.sh deploy/start_hotspot.sh deploy/wifi_adapter.sh
      - run: python deploy/gateway.py --config deploy/gateway.json.example --output build/gateway
      - run: sudo apt-get update && sudo apt-get install -y nftables dnsmasq-base
      - run: sudo dnsmasq --test --conf-file="$PWD/build/gateway/dnsmasq.conf"
      - run: sudo unshare --net nft --check --file="$PWD/build/gateway/gateway.nft"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Student browser flow
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8765 > /tmp/ui-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8765/healthz > /dev/null; then break; fi
            sleep 0.2
          done
          node tests/browser_student.cjs
