<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход на тестирование</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; background:#0f172a; color:#e2e8f0;
         display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
  .card { background:#1e293b; padding:2rem; border-radius:12px; width:90%; max-width:360px;
           box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  h1 { font-size:1.3rem; margin-top:0; }
  input { width:100%; padding:.75rem; border-radius:8px; border:1px solid #334155;
          background:#0f172a; color:#e2e8f0; font-size:1rem; box-sizing:border-box; margin-bottom:1rem;}
  button { width:100%; padding:.85rem; border:none; border-radius:8px; background:#2563eb;
           color:white; font-size:1rem; cursor:pointer; }
  button:disabled { background:#475569; cursor:not-allowed; }
  #status { margin-top:1rem; font-size:.9rem; color:#94a3b8; text-align:center; }
  .ok { color:#4ade80 !important; }
  .err { color:#f87171 !important; }
</style>
</head>
<body>
  <div class="card">
    <h1>Вход на тестирование</h1>
    <input id="nameInput" type="text" placeholder="Фамилия Имя" autocomplete="off" />
    <button id="joinBtn">Подключиться</button>
    <div id="status">Ожидание подключения…</div>
  </div>

<script>
const joinBtn = document.getElementById('joinBtn');
const nameInput = document.getElementById('nameInput');
const statusEl = document.getElementById('status');
let ws = null;

joinBtn.addEventListener('click', () => {
  const name = nameInput.value.trim();
  if (!name) {
    statusEl.textContent = 'Введите имя';
    statusEl.className = 'err';
    return;
  }
  joinBtn.disabled = true;
  nameInput.disabled = true;

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/student?name=${encodeURIComponent(name)}`);

  ws.onopen = () => {
    statusEl.textContent = 'Подключено. Ожидание начала теста…';
    statusEl.className = 'ok';
  };

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.type === 'joined') {
      sessionStorage.setItem('student_id', data.student_id);
      sessionStorage.setItem('student_name', name);
      if (data.test_started) {
        window.location.href = '/test';
      }
    } else if (data.type === 'start') {
      window.location.href = '/test';
    }
  };

  ws.onclose = () => {
    statusEl.textContent = 'Соединение потеряно. Обновите страницу.';
    statusEl.className = 'err';
    joinBtn.disabled = false;
    nameInput.disabled = false;
  };

  ws.onerror = () => {
    statusEl.textContent = 'Ошибка соединения';
    statusEl.className = 'err';
  };

  // keepalive ping раз в 20 секунд, чтобы прокси не рвал соединение
  setInterval(() => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({type: 'ping'}));
    }
  }, 20000);
});
</script>
</body>
</html>
